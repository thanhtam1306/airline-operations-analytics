# Multi-target profile:
#   postgres  -> PostgreSQL server (local:5432 or Docker)
#   local     -> DuckDB file (default lightweight)
#   snowflake -> cloud warehouse
#
# Switch with:  dbt build --target postgres   (or set DBT_TARGET=postgres)
airline_dwh:
  target: "{{ env_var('DBT_TARGET', 'postgres') }}"
  outputs:
    postgres:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', '123456') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'airline_dwh') }}"
      schema: "{{ env_var('POSTGRES_SCHEMA', 'raw') }}"
      threads: 4

    local:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '../../warehouse/airline.duckdb') }}"
      schema: main
      threads: 4

    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORM_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'AIRLINE_DWH') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'RAW') }}"
      threads: 8
